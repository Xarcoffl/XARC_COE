version: '3.8'

services:
  arvr-coe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arvr-coe-platform
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-arvr-coe-pec-super-secret-jwt-key-2026}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://coe.xarc.online}
    volumes:
      # Persistent JSON database volume - survives container rebuilds
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
